<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relay Console</title>
<style>
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0} body{font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
  img{max-width:100%} [hidden]{display:none!important}
</style>
</head>
<body>
<style>
  /* Layout: a telemetry/ops console — sticky bar, KPI rail, a 2-col card grid
     that collapses to one column on phones. Dark-capable, theme-token driven. */
  :root{
    color-scheme: light;
    --page:#eef0ec; --surface:#ffffff; --surface-2:#f7f8f5;
    --ink:#11141a; --ink-2:#565b63; --muted:#8a8f97;
    --border:rgba(17,20,26,.10); --border-2:rgba(17,20,26,.06);
    --grid:#e6e8e2; --axis:#c9ccc4;
    --accent:#2a6ad6; --accent-ink:#1d539f; --accent-soft:rgba(42,106,214,.13);
    --good:#0a8f2c; --good-soft:rgba(10,143,44,.14);
    --warn:#c7850b; --warn-soft:rgba(199,133,11,.16);
    --crit:#d03b3b; --crit-soft:rgba(208,59,59,.14);
    --seq-1:#d3e3fb; --seq-2:#a6c8f5; --seq-3:#5f9aea; --seq-4:#2a78d6; --seq-5:#174f95;
    --shadow:0 1px 2px rgba(17,20,26,.05),0 8px 24px -14px rgba(17,20,26,.22);
    --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0a0c0f; --surface:#14171c; --surface-2:#191d23;
    --ink:#f1f3f6; --ink-2:#a9afb8; --muted:#7c828b;
    --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.05);
    --grid:#23272d; --axis:#363b42;
    --accent:#3f8ce8; --accent-ink:#8fbcf2; --accent-soft:rgba(63,140,232,.16);
    --good:#1fb03f; --good-soft:rgba(31,176,63,.16);
    --warn:#e3a013; --warn-soft:rgba(227,160,19,.15);
    --crit:#e05a5a; --crit-soft:rgba(224,90,90,.15);
    --seq-1:#15273c; --seq-2:#1d4e8f; --seq-3:#2f74c6; --seq-4:#3f8ce8; --seq-5:#8fbdf2;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -16px rgba(0,0,0,.7);
  }}
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0a0c0f; --surface:#14171c; --surface-2:#191d23;
    --ink:#f1f3f6; --ink-2:#a9afb8; --muted:#7c828b;
    --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.05);
    --grid:#23272d; --axis:#363b42;
    --accent:#3f8ce8; --accent-ink:#8fbcf2; --accent-soft:rgba(63,140,232,.16);
    --good:#1fb03f; --good-soft:rgba(31,176,63,.16);
    --warn:#e3a013; --warn-soft:rgba(227,160,19,.15);
    --crit:#e05a5a; --crit-soft:rgba(224,90,90,.15);
    --seq-1:#15273c; --seq-2:#1d4e8f; --seq-3:#2f74c6; --seq-4:#3f8ce8; --seq-5:#8fbdf2;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -16px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box}
  body{background:var(--page);color:var(--ink);font-family:var(--body);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:48px 28px}
  .theme-fab{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;z-index:40}
  h1,h2,h3{margin:0;font-family:var(--sans);text-wrap:balance}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---- top bar ---- */
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
    background:color-mix(in srgb,var(--page) 86%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .bar{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;
    align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .logo{width:34px;height:34px;border-radius:9px;flex:none;
    background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    display:grid;place-items:center;box-shadow:0 2px 10px -2px var(--accent-soft)}
  .logo svg{width:19px;height:19px}
  .brand b{font-family:var(--sans);font-weight:700;font-size:16px;letter-spacing:-.01em}
  .brand span{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
  .live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);
    padding:5px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--good);
    box-shadow:0 0 0 0 var(--good-soft);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 var(--good-soft)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .spacer{flex:1 1 auto}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface)}
  .seg button{font:inherit;font-size:12.5px;color:var(--ink-2);background:none;border:0;
    padding:7px 12px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .icon-btn{font:inherit;cursor:pointer;background:var(--surface);color:var(--ink-2);
    border:1px solid var(--border);border-radius:9px;width:36px;height:34px;display:grid;place-items:center}
  .icon-btn:hover{color:var(--ink)}
  .icon-btn svg{width:17px;height:17px}

  /* ---- KPI rail ---- */
  .kpis{display:grid;gap:10px;grid-template-columns:repeat(6,1fr);margin-top:0}
  @media (max-width:860px){.kpis{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:480px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:13px;
    padding:11px 13px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
  .kpi .k-label{font-size:11px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
  .kpi .k-val{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:5px;line-height:1}
  .kpi .k-foot{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11.5px;color:var(--ink-2)}
  .delta{font-family:var(--mono);font-weight:600;display:inline-flex;align-items:center;gap:3px}
  .delta.up{color:var(--good)} .delta.down{color:var(--crit)} .delta.flat{color:var(--muted)}
  .spark{position:absolute;right:11px;bottom:10px;width:60px;height:24px;opacity:.9}

  /* ---- card grid ---- */
  .grid{display:grid;gap:11px;grid-template-columns:1fr;margin-top:11px}
  @media (min-width:720px){.grid{grid-template-columns:1fr 1fr}.span-2{grid-column:1/-1}}
  @media (min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.span-2{grid-column:span 2}.span-3{grid-column:1/-1}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:15px;
    padding:14px 15px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column}
  .card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:3px}
  .card-h h3{font-size:14px;font-weight:600;letter-spacing:-.01em}
  .card-h .sub{font-size:11.5px;color:var(--muted)}
  .card .cap{font-size:12px;color:var(--ink-2);margin:1px 0 9px}

  /* chart primitives */
  svg{display:block;width:100%;height:auto}
  .ax{fill:var(--muted);font-size:11px;font-family:var(--mono)}
  .gl{stroke:var(--grid);stroke-width:1}
  .baseline{stroke:var(--axis);stroke-width:1}
  .area{fill:var(--accent-soft)}
  .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .end-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
  .crosshair{stroke:var(--axis);stroke-width:1;stroke-dasharray:3 3}
  .hover-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
  .bar{fill:var(--accent)}
  .bar-track{fill:var(--border-2)}
  .blabel{fill:var(--ink-2);font-size:12px}
  .bval{fill:var(--ink);font-size:12px;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .cell{stroke:var(--surface);stroke-width:2;rx:2}
  .cell.h0{fill:var(--seq-1)} .cell.h1{fill:var(--seq-2)} .cell.h2{fill:var(--seq-3)}
  .cell.h3{fill:var(--seq-4)} .cell.h4{fill:var(--seq-5)}

  /* status split */
  .statbar{display:flex;height:30px;border-radius:9px;overflow:hidden;gap:2px;background:var(--surface)}
  .statbar i{display:block;height:100%}
  .seg-good{background:var(--good)} .seg-warn{background:var(--warn)} .seg-crit{background:var(--crit)}
  .legend{display:flex;flex-direction:column;gap:8px;margin-top:11px}
  .legend .row{display:flex;align-items:center;gap:9px;font-size:13px}
  .legend .row .sw{width:11px;height:11px;border-radius:3px;flex:none}
  .legend .row .nm{color:var(--ink-2)} .legend .row .vv{margin-left:auto;font-family:var(--mono);font-weight:600}

  /* health */
  .health{display:flex;flex-direction:column;gap:11px;margin-top:3px}
  .svc{display:flex;align-items:center;gap:12px}
  .svc .nm{font-size:13.5px;font-weight:600}
  .svc .meta{font-size:11.5px;color:var(--muted)}
  .pill{margin-left:auto;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;
    display:inline-flex;align-items:center;gap:6px}
  .pill.ok{background:var(--good-soft);color:var(--good)}
  .pill.dg{background:var(--warn-soft);color:var(--warn)}
  .svc .up{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);width:64px;text-align:right}

  /* heat legend */
  .heat-legend{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin-top:9px}
  .heat-legend .steps{display:flex;gap:2px}
  .heat-legend .steps i{width:16px;height:10px;border-radius:2px;display:block}

  /* capabilities */
  .caps{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-top:11px}
  @media (min-width:640px){.caps{grid-template-columns:repeat(4,1fr)}}
  .cap-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:12px;box-shadow:var(--shadow)}
  .cap-card .ci{width:26px;height:26px;border-radius:7px;background:var(--accent-soft);
    color:var(--accent);display:grid;place-items:center;margin-bottom:7px}
  .cap-card .ci svg{width:15px;height:15px}
  .cap-card b{font-family:var(--sans);font-size:13px;font-weight:600;display:block}
  .cap-card p{margin:3px 0 0;font-size:11.5px;color:var(--ink-2);line-height:1.4}

  .sec-label{font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);margin:18px 0 2px}

  footer{margin-top:20px;padding-top:14px;border-top:1px solid var(--border);
    display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:12px;color:var(--muted)}
  footer .stack{display:flex;flex-wrap:wrap;gap:7px}
  footer .tag{font-family:var(--mono);font-size:11px;color:var(--ink-2);
    border:1px solid var(--border);border-radius:6px;padding:3px 8px;background:var(--surface-2)}

  .tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--page);
    font-family:var(--mono);font-size:11.5px;padding:6px 9px;border-radius:7px;
    box-shadow:0 6px 20px -6px rgba(0,0,0,.5);transform:translate(-50%,-130%);white-space:nowrap;opacity:0;transition:opacity .09s}
  .note{font-size:11.5px;color:var(--muted);margin-top:8px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<button class="icon-btn theme-fab" id="theme" aria-label="Toggle theme" title="Toggle theme">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
</button>

<div class="wrap">
  <section class="kpis" id="kpis" aria-label="Key metrics"></section>

  <div class="sec-label">Operations</div>
  <section class="grid">
    <figure class="card span-2" style="margin:0">
      <div class="card-h"><h3>Messages relayed</h3><span class="sub mono" id="msg-sub">last 30 days</span></div>
      <div class="cap">Pseudonymous messages routed across all active bot instances.</div>
      <div id="chart-messages"></div>
    </figure>

    <figure class="card" style="margin:0">
      <div class="card-h"><h3>Receipt pipeline</h3></div>
      <div class="cap">Share of processed receipts by review outcome.</div>
      <div class="statbar" id="statbar"></div>
      <div class="legend" id="stat-legend"></div>
    </figure>

    <figure class="card span-2" style="margin:0">
      <div class="card-h"><h3>Reconciliations by region</h3><span class="sub mono">30d · count</span></div>
      <div class="cap">Automated settlement reports generated per operating region.</div>
      <div id="chart-regions"></div>
    </figure>

    <aside class="card" style="margin:0">
      <div class="card-h"><h3>Service health</h3></div>
      <div class="health" id="health"></div>
      <div class="note">90-day availability · UTC</div>
    </aside>

    <figure class="card span-3" style="margin:0">
      <div class="card-h"><h3>Processing activity</h3><span class="sub mono">events · hour × weekday</span></div>
      <div class="cap">When the platform is busiest — relayed messages and receipts by hour of day.</div>
      <div id="chart-heat"></div>
      <div class="heat-legend">Low
        <span class="steps"><i style="background:var(--seq-1)"></i><i style="background:var(--seq-2)"></i><i style="background:var(--seq-3)"></i><i style="background:var(--seq-4)"></i><i style="background:var(--seq-5)"></i></span>
        High</div>
    </figure>
  </section>

  <div class="sec-label">Platform capabilities</div>
  <section class="caps" id="caps"></section>

  <footer>
    <span>Built & operated solo · 99.98% uptime</span>
    <div class="spacer"></div>
    <div class="stack">
      <span class="tag">Python</span><span class="tag">python-telegram-bot</span>
      <span class="tag">aiogram</span><span class="tag">SQLite</span>
      <span class="tag">systemd</span><span class="tag">DigitalOcean</span>
    </div>
  </footer>
</div>
<div class="tip" id="tip" role="status" aria-live="off"></div>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

<script>
(function(){
  "use strict";
  const SVGNS="http://www.w3.org/2000/svg";
  const el=(n,a)=>{const e=document.createElementNS(SVGNS,n);for(const k in(a||{}))e.setAttribute(k,a[k]);return e;};
  const fmt=n=>{n=Math.round(n);if(n>=1e6)return (n/1e6).toFixed(2).replace(/\.?0+$/,'')+"M";if(n>=1e3)return (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,'')+"k";return String(n);};
  // deterministic PRNG so screenshots are stable
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  const rnd=mulberry32(20261002);

  const tip=document.getElementById('tip');
  function showTip(x,y,html){tip.innerHTML=html;tip.style.left=x+'px';tip.style.top=y+'px';tip.style.opacity=1;}
  function hideTip(){tip.style.opacity=0;}

  /* ---------------- KPIs ---------------- */
  function spark(series,up){
    const W=66,H=26,mx=Math.max(...series),mn=Math.min(...series);
    const xs=i=>i*(W/(series.length-1)), ys=v=>H-2-((v-mn)/((mx-mn)||1))*(H-4);
    let d="";series.forEach((v,i)=>{d+=(i?"L":"M")+xs(i).toFixed(1)+" "+ys(v).toFixed(1)+" ";});
    const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,class:"spark"});
    const col=up?"var(--good)":"var(--crit)";
    const area=el("path",{d:d+`L ${W} ${H} L 0 ${H} Z`,fill:col,opacity:".12"});
    const ln=el("path",{d,fill:"none",stroke:col,"stroke-width":"1.6","stroke-linejoin":"round"});
    svg.append(area,ln);return svg;
  }
  const KPI=[
    {label:"Active bots",val:"142",d:"+8",dir:"up",foot:"instances"},
    {label:"Messages / 30d",val:"2.41M",d:"+12.4%",dir:"up",foot:"relayed"},
    {label:"Receipts / 30d",val:"51.2k",d:"+6.1%",dir:"up",foot:"processed"},
    {label:"Reconciliations",val:"1,906",d:"+3.8%",dir:"up",foot:"auto reports"},
    {label:"FX updates",val:"7,480",d:"+18%",dir:"up",foot:"broadcast"},
    {label:"Uptime",val:"99.98%",d:"0 incidents",dir:"flat",foot:"90 days"},
  ];
  const kw=document.getElementById('kpis');
  KPI.forEach(k=>{
    const s=[];let v=30+rnd()*20;for(let i=0;i<16;i++){v+=(rnd()-.42)*7;s.push(Math.max(8,v));}
    const arrow=k.dir==="up"?"▲":k.dir==="down"?"▼":"•";
    const div=document.createElement('div');div.className="kpi";
    div.innerHTML=`<div class="k-label">${k.label}</div><div class="k-val">${k.val}</div>
      <div class="k-foot"><span class="delta ${k.dir}">${arrow} ${k.d}</span><span>${k.foot}</span></div>`;
    div.appendChild(spark(s,k.dir!=="down"));
    kw.appendChild(div);
  });

  /* ---------------- Messages area chart ---------------- */
  (function(){
    const N=30, base=[], W=760,H=196,m={t:14,r:58,b:26,l:14};
    let v=62000;
    for(let i=0;i<N;i++){const wk=1+0.14*Math.sin(i/7*Math.PI*2); v+= (rnd()-.4)*4200; const val=Math.max(42000,v*wk); base.push(val);}
    // gentle uptrend
    const data=base.map((x,i)=>x + i*430);
    const iw=W-m.l-m.r, ih=H-m.t-m.b;
    const max=Math.max(...data)*1.12, min=0;
    const xs=i=>m.l+iw*i/(N-1), ys=val=>m.t+ih*(1-(val-min)/(max-min));
    const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Messages relayed per day, trending up over 30 days"});
    // gridlines + y labels
    for(let g=0;g<=4;g++){const yv=max*g/4,y=ys(yv);
      svg.appendChild(el("line",{class:"gl",x1:m.l,y1:y,x2:W-m.r,y2:y}));
      const t=el("text",{class:"ax",x:W-m.r+6,y:y+3.5});t.textContent=fmt(yv);svg.appendChild(t);}
    // x ticks
    for(let i=0;i<N;i+=6){const t=el("text",{class:"ax",x:xs(i),y:H-10,"text-anchor":"middle"});t.textContent="D"+(i+1);svg.appendChild(t);}
    let d="",a="M "+m.l+" "+ys(data[0]);
    data.forEach((val,i)=>{const X=xs(i),Y=ys(val);d+=(i?"L":"M")+X.toFixed(1)+" "+Y.toFixed(1)+" ";a+=" L "+X.toFixed(1)+" "+Y.toFixed(1);});
    a+=" L "+xs(N-1)+" "+ys(0)+" L "+m.l+" "+ys(0)+" Z";
    svg.appendChild(el("path",{class:"area",d:a}));
    svg.appendChild(el("path",{class:"line",d}));
    svg.appendChild(el("line",{class:"baseline",x1:m.l,y1:ys(0),x2:W-m.r,y2:ys(0)}));
    // endpoint
    svg.appendChild(el("circle",{class:"end-dot",cx:xs(N-1),cy:ys(data[N-1]),r:3.5}));
    const lbl=el("text",{class:"ax",x:xs(N-1),y:ys(data[N-1])-9,"text-anchor":"end",fill:"var(--accent-ink)","font-weight":"600"});
    lbl.textContent=fmt(data[N-1]);svg.appendChild(lbl);
    // hover
    const ch=el("line",{class:"crosshair",y1:m.t,y2:ys(0),x1:-9,x2:-9,opacity:0});
    const hd=el("circle",{class:"hover-dot",r:4,cx:-9,cy:-9,opacity:0});svg.append(ch,hd);
    const host=document.getElementById('chart-messages');host.appendChild(svg);
    svg.addEventListener('mousemove',e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)/r.width*W;
      let i=Math.round((px-m.l)/iw*(N-1));i=Math.max(0,Math.min(N-1,i));
      ch.setAttribute('x1',xs(i));ch.setAttribute('x2',xs(i));ch.setAttribute('opacity',1);
      hd.setAttribute('cx',xs(i));hd.setAttribute('cy',ys(data[i]));hd.setAttribute('opacity',1);
      showTip(e.clientX,e.clientY,`Day ${i+1} · <b>${fmt(data[i])}</b> msgs`);});
    svg.addEventListener('mouseleave',()=>{ch.setAttribute('opacity',0);hd.setAttribute('opacity',0);hideTip();});
  })();

  /* ---------------- Regions horizontal bars ---------------- */
  (function(){
    const rows=[["Argentina",1840],["Colombia",1610],["Peru",1485],["Mexico",1320],
      ["Brazil",1180],["Chile",905],["Ecuador",760],["Bolivia",640],["Paraguay",515],
      ["Venezuela",470],["Morocco",360],["Indonesia",295]];
    const W=760,rowH=21,rgap=5,m={t:4,r:60,l:96,b:4};
    const totalH=m.t+m.b+rows.length*rowH+(rows.length-1)*rgap;
    const max=Math.max(...rows.map(r=>r[1]))*1.02, iw=W-m.l-m.r;
    const svg=el("svg",{viewBox:`0 0 ${W} ${totalH}`,role:"img","aria-label":"Reconciliations by region"});
    rows.forEach((r,i)=>{
      const y=m.t+i*(rowH+rgap);
      const nm=el("text",{class:"blabel",x:m.l-10,y:y+rowH/2+4,"text-anchor":"end"});nm.textContent=r[0];svg.appendChild(nm);
      svg.appendChild(el("rect",{class:"bar-track",x:m.l,y:y+4,width:iw,height:rowH-8,rx:5}));
      const w=Math.max(4,iw*r[1]/max);
      const bar=el("rect",{class:"bar",x:m.l,y:y+4,width:w,height:rowH-8,rx:5});svg.appendChild(bar);
      const vv=el("text",{class:"bval",x:m.l+w+8,y:y+rowH/2+4});vv.textContent=r[1].toLocaleString('en-US');svg.appendChild(vv);
      [bar].forEach(b=>{b.style.cursor="crosshair";
        b.addEventListener('mousemove',e=>showTip(e.clientX,e.clientY,`${r[0]} · <b>${r[1].toLocaleString('en-US')}</b>`));
        b.addEventListener('mouseleave',hideTip);});
    });
    document.getElementById('chart-regions').appendChild(svg);
  })();

  /* ---------------- Receipt status split ---------------- */
  (function(){
    const parts=[["Approved",91.4,"good","seg-good","var(--good)"],
      ["Pending review",5.9,"warn","seg-warn","var(--warn)"],
      ["Declined",2.7,"crit","seg-crit","var(--crit)"]];
    const bar=document.getElementById('statbar'), leg=document.getElementById('stat-legend');
    parts.forEach(p=>{const i=document.createElement('i');i.className=p[3];i.style.width=p[1]+"%";
      i.title=`${p[0]} — ${p[1]}%`;bar.appendChild(i);
      const row=document.createElement('div');row.className="row";
      row.innerHTML=`<span class="sw" style="background:${p[4]}"></span><span class="nm">${p[0]}</span><span class="vv">${p[1]}%</span>`;
      leg.appendChild(row);});
  })();

  /* ---------------- Service health ---------------- */
  (function(){
    const svc=[["Relay service","secret bots · pseudonyms · receipts","ok","Operational","99.98%"],
      ["Accounting service","сверки · FX rates · settlements","ok","Operational","99.97%"],
      ["Feedback bot","intake · routing","ok","Operational","99.99%"]];
    const h=document.getElementById('health');
    svc.forEach(s=>{const d=document.createElement('div');d.className="svc";
      d.innerHTML=`<div><div class="nm">${s[0]}</div><div class="meta">${s[1]}</div></div>
        <span class="pill ${s[2]}"><span class="dot" style="animation:none"></span>${s[3]}</span>
        <span class="up">${s[4]}</span>`;h.appendChild(d);});
  })();

  /* ---------------- Processing heatmap ---------------- */
  (function(){
    const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],hours=24;
    const W=760,m={t:8,r:8,l:40,b:22},gap=3;
    const cw=(W-m.l-m.r-(hours-1)*gap)/hours, chh=15;
    const H=m.t+m.b+days.length*(chh+gap)-gap;
    const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Processing activity by hour and weekday"});
    for(let d=0;d<days.length;d++){
      const t=el("text",{class:"ax",x:m.l-8,y:m.t+d*(chh+gap)+chh/2+3.5,"text-anchor":"end"});t.textContent=days[d];svg.appendChild(t);
      const weekend=d>=5;
      for(let hh=0;hh<hours;hh++){
        // busy midday on weekdays, flatter weekends
        const peak=Math.exp(-Math.pow(hh-14,2)/42)*(weekend?.6:1)+Math.exp(-Math.pow(hh-20,2)/26)*.5;
        let v=peak*(0.75+rnd()*0.5); v=Math.max(0,Math.min(1,v));
        const b=v<.2?0:v<.4?1:v<.62?2:v<.82?3:4;
        const x=m.l+hh*(cw+gap), y=m.t+d*(chh+gap);
        const c=el("rect",{class:"cell h"+b,x:x,y:y,width:cw,height:chh,rx:2});
        c.style.cursor="crosshair";const evv=Math.round(v*1400+60);
        c.addEventListener('mousemove',e=>showTip(e.clientX,e.clientY,`${days[d]} ${String(hh).padStart(2,'0')}:00 · <b>${evv}</b> ev`));
        c.addEventListener('mouseleave',hideTip);
        svg.appendChild(c);
      }
    }
    for(let hh=0;hh<hours;hh+=6){const x=m.l+hh*(cw+gap)+cw/2;const t=el("text",{class:"ax",x:x,y:H-6,"text-anchor":"middle"});t.textContent=String(hh).padStart(2,'0');svg.appendChild(t);}
    document.getElementById('chart-heat').appendChild(svg);
  })();

  /* ---------------- Capabilities ---------------- */
  (function(){
    const I={
      relay:'<path d="M4 7h11M4 12h7M4 17h13"/>',
      shield:'<path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/>',
      pin:'<path d="M12 2v6m0 0l-4 4h8l-4-4zm0 10v8"/>',
      clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
      coins:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
      bolt:'<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>',
      receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
      log:'<path d="M4 5h16M4 10h16M4 15h10M4 20h7"/>'
    };
    const caps=[
      ["relay","Pseudonymous relay","Each chat gets its own bot; identities never cross."],
      ["shield","Role-based invites","Invite links grant admin, handler, or watcher on join."],
      ["pin","Auto-pinned requisites","Current payment details pinned to every participant instantly."],
      ["clock","Shift scheduling","Per-chat working hours drive automated daily reporting."],
      ["coins","Multi-currency settlement","Reconciliation across 12 regional currencies."],
      ["bolt","Automated rate broadcasts","FX rates pushed to bound chats right after each сверка."],
      ["receipt","Receipt pipeline","Photo/amount capture, review, and audit in one flow."],
      ["log","Persistent audit log","Every message and edit survives restarts, replayable."]
    ];
    const w=document.getElementById('caps');
    caps.forEach(c=>{const d=document.createElement('div');d.className="cap-card";
      d.innerHTML=`<div class="ci"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${I[c[0]]}</svg></div>
        <b>${c[1]}</b><p>${c[2]}</p>`;w.appendChild(d);});
  })();

  /* ---------------- chrome: theme + range (visual only) ---------------- */
  (function(){
    const root=document.documentElement, btn=document.getElementById('theme');
    let saved=null;try{saved=localStorage.getItem('relay-theme');}catch(e){}
    if(saved)root.setAttribute('data-theme',saved);
    btn.addEventListener('click',()=>{
      const cur=root.getAttribute('data-theme');
      const isDark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
      const next=isDark?'light':'dark';root.setAttribute('data-theme',next);
      try{localStorage.setItem('relay-theme',next);}catch(e){}
    });
    const seg=document.querySelectorAll('.seg button'), sub=document.getElementById('msg-sub');
    seg.forEach(b=>b.addEventListener('click',()=>{seg.forEach(x=>x.removeAttribute('aria-pressed'));
      b.setAttribute('aria-pressed','true');sub.textContent='last '+b.dataset.r+' days';}));
  })();
})();
</script>
</body>
</html>
